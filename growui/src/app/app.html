<!-- src/app/app.html -->
<!-- Sidebar overlay for mobile (outside layout flow) -->
<div class="sidebar-overlay" *ngIf="isMobile() && sidebarOpen()" (click)="closeSidebar()"></div>

<div class="app-layout">

  <!-- Sidebar -->
  <app-sidebar
    [mobile]="isMobile()"
    [activeNav]="activePage()"
    [mobileOpen]="sidebarOpen()"
    (mobileOpenChange)="sidebarOpen.set($event)"
    (navChange)="onNavChange($event)">
  </app-sidebar>

  <!-- Main content -->
  <div class="main-content">
    <!-- Topbar -->
    <app-topbar
      [dashboard]="ds()"
      [isMobile]="isMobile()"
      (menuClick)="toggleSidebar()">
    </app-topbar>

    <!-- Page content -->
    <div class="page-content">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
