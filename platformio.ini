; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
board = esp32dev
platform = https://github.com/pioarduino/platform-espressif32.git#develop
platform_packages = 
	framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#3.1.1
framework = 
	arduino
lib_deps = https://github.com/KillerInk/DFRobot_GP8403.git
            https://github.com/ESP32Async/ESPAsyncWebServer.git#v3.7.0
            https://github.com/ESP32Async/AsyncTCP.git#v3.3.5
            https://github.com/arduino-libraries/Arduino_JSON.git
            https://github.com/h2zero/NimBLE-Arduino.git
            https://github.com/DFRobot/DFRobot_ENS160
            https://github.com/finitespace/BME280.git
	        dvarrel/AHT20@^1.0.0

board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_upload.flash_size = 4MB
board_build.partitions = custom_partition.csv
build_flags = -DCORE_DEBUG_LEVEL=5
              -DCONFIG_NIMBLE_CPP_LOG_LEVEL=0
build_unflags = -Werror=all.

monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
board_build.arduino.upstream_packages = no

board_build.embed_files =
	data/www/index.html
    data/www/script.js
    data/www/style.css
